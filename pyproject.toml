[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automarker"
version = "0.1.0"
description = "Offline ArUco quiz alignment, answer region extraction, and mathematical OCR"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
ocr = [
  "transformers>=4.48,<4.50",
  "optimum[onnxruntime]>=1.24,<2",
  "torch>=2.6,<2.7",
  "huggingface-hub>=0.28,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
automarker = "automarker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=outputs/pytest-tmp"
cache_dir = "outputs/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py311"
